
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101114">
<title>VideoMax</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101114;color:white;font-family:Arial,sans-serif;padding:25px 18px}
header{font-size:25px;font-weight:bold;color:#ffad24;margin:15px 0 55px}
h1{font-size:35px}
p{color:#aaa;line-height:1.5}
.card{background:#202127;padding:20px;border-radius:18px;margin-top:25px}
input{width:100%;padding:16px;border-radius:12px;border:1px solid #555;background:#111;color:white;font-size:15px}
button{width:100%;padding:17px;background:#ffad24;color:#111;border:0;border-radius:12px;font-weight:bold;margin-top:13px;font-size:15px}
.small{font-size:12px;color:#999}
</style>
</head>
<body>
<header>⬇ VideoMax</header>
<h1>Seus vídeos,<br><span style="color:#ffad24">em um só lugar.</span></h1>
<p>Cole o link do vídeo para começar.</p>

<div class="card">
<label>LINK DO VÍDEO</label>
<input id="link" type="url" placeholder="Cole seu link aqui">
<button onclick="analisar()">ANALISAR VÍDEO</button>
<p id="status"></p>
<p class="small">Compatível com links diretos de arquivos de vídeo autorizados. Para redes sociais, utilize os recursos oficiais de download.</p>
</div>

<div class="card">
<h3>Plataformas</h3>
<p>♪ TikTok</p>
<p>◎ Instagram</p>
<p>▶ Kwai</p>
</div>

<script>
function analisar(){
const campo=document.getElementById('link');
const status=document.getElementById('status');
let url;
try{
url=new URL(campo.value.trim());
if(!['http:','https:'].includes(url.protocol))throw Error();
}catch(e){
status.textContent='Cole um link válido.';
return;
}
if(/\.(mp4|mov|m4v|webm)$/i.test(url.pathname)){
const a=document.createElement('a');
a.href=url.href;
a.download='videomax-video';
a.rel='noopener';
document.body.appendChild(a);
a.click();
a.remove();
status.textContent='Solicitação de download enviada!';
}else{
status.textContent='Abra a plataforma de origem e utilize as opções oficiais para salvar o vídeo.';
window.open(url.href,'_blank','noopener');
}
}
</script>
</body>
</html>
